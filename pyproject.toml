[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["backend/planner/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["backend"]
testpaths = ["backend/planner/tests"]
addopts = "-q"
